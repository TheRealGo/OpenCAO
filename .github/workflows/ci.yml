name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: uv sync --locked --extra dev --python python
      - run: uv run python tools/check_repository_hygiene.py
      - run: uv run python tools/check_publication.py
      - run: uv run ruff check .
      - run: uv run mypy src/cao_control_plane
      - run: uv run pytest
      - run: uv run python -m compileall -q src
      - if: matrix.python-version == '3.13'
        run: uv run python -m build

  mcp-inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: uv sync --locked --python python
      - run: mkdir -p "$CAO_A2A_STATE_DIR"
        env:
          CAO_A2A_STATE_DIR: ${{ runner.temp }}/cao-inspector-state
      - name: Verify the canonical stdio catalog with the official MCP Inspector
        env:
          CAO_A2A_STATE_DIR: ${{ runner.temp }}/cao-inspector-state
          CAO_A2A_PUBLIC_BASE_URL: http://127.0.0.1:8768
        run: |
          uv run cao-a2a init > /dev/null
          uv run cao-a2a serve --host 127.0.0.1 --port 8768 \
            > "${{ runner.temp }}/cao-inspector-daemon.log" 2>&1 &
          control_plane_pid=$!
          cleanup() {
            kill "$control_plane_pid" 2>/dev/null || true
            wait "$control_plane_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8768/health > /dev/null; then
              break
            fi
            if ! kill -0 "$control_plane_pid" 2>/dev/null; then
              cat "${{ runner.temp }}/cao-inspector-daemon.log"
              exit 1
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:8768/health > /dev/null
          uv run -- npx --yes @modelcontextprotocol/inspector@2.3.0 --cli \
            --config tests/fixtures/mcp-inspector-canonical.json \
            -e "CAO_A2A_STATE_DIR=$CAO_A2A_STATE_DIR" \
            -e "CAO_A2A_PUBLIC_BASE_URL=$CAO_A2A_PUBLIC_BASE_URL" \
            --server cao-conversation --method tools/list --format json \
            > "${{ runner.temp }}/mcp-conversation-tools.json"
          uv run -- npx --yes @modelcontextprotocol/inspector@2.3.0 --cli \
            --config tests/fixtures/mcp-inspector-canonical.json \
            -e "CAO_A2A_STATE_DIR=$CAO_A2A_STATE_DIR" \
            -e "CAO_A2A_PUBLIC_BASE_URL=$CAO_A2A_PUBLIC_BASE_URL" \
            --server cao-shared-operator --method tools/list --format json \
            > "${{ runner.temp }}/mcp-operator-tools.json"
      - name: Assert the inspected CAO catalog
        run: >-
          python -c 'import json, pathlib;
          conversation = json.loads(pathlib.Path("${{ runner.temp }}/mcp-conversation-tools.json").read_text());
          operator = json.loads(pathlib.Path("${{ runner.temp }}/mcp-operator-tools.json").read_text());
          names = {tool.get("name") for tool in conversation.get("result", {}).get("tools", [])};
          operator_names = {tool.get("name") for tool in operator.get("result", {}).get("tools", [])};
          required = {"cao_new_worker_thread", "cao_instruct_worker_thread", "cao_finish_worker_thread", "cao_resume_worker_thread", "cao_delete_worker_thread"};
          removed = {"cao_delegate_target", "cao_delegate_new_worker", "cao_abandon_system_reconciliation", "cao_provision_managed_worker", "cao_stop_managed_worker"};
          assert required <= names, required - names;
          assert "cao_get_inbox" in operator_names;
          assert names.isdisjoint(removed), names & removed;
          assert operator_names.isdisjoint(removed), operator_names & removed'
